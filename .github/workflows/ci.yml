name: CI

# Run on pushes to main and on pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint & test (py3.12)
    runs-on: ubuntu-latest
    steps:
      # 1) Check out the repository.
      - uses: actions/checkout@v4

      # 2) Install Python 3.12 (matches local dev) with pip caching.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3) Install only the lightweight dependencies needed by unit tests.
      #    Heavy model backends stay lazy-imported and are covered by adapter
      #    tests without downloading model stacks in CI.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy soundfile scipy pytest ruff

      # 4) Lint. Non-blocking for now (continue-on-error) until the existing
      #    codebase is fully ruff-clean; flip to a hard gate afterwards.
      - name: Ruff lint
        continue-on-error: true
        run: ruff check src tests main.py app.py

      # 5) Run the unit test suite. Use `python -m pytest` so the repo root is
      #    on sys.path and the `src` package imports without an editable install.
      - name: Pytest
        run: python -m pytest -q
