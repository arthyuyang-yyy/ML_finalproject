# Project configuration read by build tools (uv, pip, hatch) and IDEs
# (PyCharm, VSCode via Pylance). The single source of truth for ruff, mypy,
# pytest, and the project's metadata — no more scattered .ini / .cfg / .toml.
#
# Run ``pip install -e .`` (or ``uv sync`` if you have uv) to make this
# project importable from anywhere; IDEs read it for path / tool discovery.

[project]
name = "meeting-memory-deploy"
version = "0.1.0"
description = "Multi-channel meeting transcription with speaker-attributed episodic memory."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "meeting-memory team" }]
keywords = ["asr", "diarization", "meeting", "mandarin", "pyannote", "whisper"]

# Pin the runtime surface. Locked versions live in uv.lock / requirements.lock
# generated by ``uv lock`` or ``pip-compile``; this list intentionally matches
# requirements.txt so that ``pip install -r requirements.txt`` and
# ``pip install -e .`` produce equivalent environments.
dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.12",
  "scipy>=1.11",
  "gradio>=5.0,<6",
  "streamlit>=1.36,<2",
  "pandas>=2.0,<3",
  "socksio>=1.0",
  "openai-whisper>=20231117",
  "faster-whisper>=1.0",
  "whisperx>=3.1",
  "pyannote.audio>=3.1",
  "funasr>=1.0",
  "speechbrain>=1.0,<2",
  "huggingface_hub>=0.23",
  "openai>=1.0",
]

[project.optional-dependencies]
# Same as the ``dev`` extras that the test / lint / format tasks rely on.
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1",
  "types-soundfile",
]
gpu = [
  # cu128 wheels — install with
  #   pip install torch torchvision torchaudio \
  #           --index-url https://download.pytorch.org/whl/cu128
  # before running the matrix on a real GPU.
  "torch>=2.5",
  "torchaudio>=2.5",
  "torchvision>=0.20",
]

[project.scripts]
# After ``pip install -e .`` you get a top-level ``meeting-memory`` shim.
meeting-memory = "main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "experiments.scripts*"]
namespaces = false

# ---------------------------------------------------------------- ruff -----

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "experiments/runs",
  "outputs",
  "data",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Pragmatic baseline — keep the codebase lint-clean without the IDE yelling
# about every line. Add new rules only when they catch a real bug.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # bugbear
  "UP",   # pyupgrade — uses the 3.11+ syntax
  "SIM",  # simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length — handled by formatter
  "B008",  # function-call-in-default-argument — common in FastAPI/DI patterns
  "RUF012", # mutable class attributes — common in our dataclasses
  "SIM108", # ternary → if/else — readability call
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # `assert False` is idiomatic in tests
"experiments/scripts/*" = ["T201"]  # print is intentional in CLI scripts
"scripts/*" = ["T201"]
"src/pipeline/run_pipeline.py" = ["C901"]  # complex but linear pipeline orchestrator

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "experiments"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------- mypy ------

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "scripts", "experiments/scripts"]
files = ["src", "main.py", "app.py", "experiments/scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

# Be permissive on third-party packages whose stubs we don't ship
[[tool.mypy.overrides]]
module = ["torch.*", "pyannote.*", "funasr.*", "whisperx.*", "faster_whisper.*", "speechbrain.*", "gradio.*", "streamlit.*"]
ignore_missing_imports = true

# --------------------------------------------------------------- pytest -----

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src", "scripts", "experiments/scripts"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "gpu: marks tests that require a GPU",
  "network: marks tests that require network access",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
